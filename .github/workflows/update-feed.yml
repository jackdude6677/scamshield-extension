name: Update phishing feed
on:
  schedule: [{ cron: '17 */4 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download OpenPhish community feed (free for non-commercial use; see openphish.com)
        run: curl -fsSL --retry 3 https://openphish.com/feed.txt -o urls.txt
      - name: Build hashed feed
        run: node scripts/build-feed.js urls.txt phishing.json "OpenPhish community feed"
      - name: Publish to the orphan "feed" branch (one commit, no history growth)
        run: |
          mkdir out && cp phishing.json out/ && cd out
          printf 'Hashed phishing list for ScamShield. Source: OpenPhish community feed. Rebuilt every 4 hours.\n' > README.txt
          git init -q -b feed && git config user.name "scamshield-bot" && git config user.email "bot@users.noreply.github.com"
          git add . && git commit -q -m "Update feed $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" feed
